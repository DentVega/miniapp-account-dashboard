name: Publish miniapp

# Build the federated chunk and publish it to Backstage (ADR-016).

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Lets Backstage's "Deploy" button trigger a build+publish on demand.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps (GitHub Packages)
        # pnpm ignores the ${TOKEN} in the committed .npmrc (it won't expand env
        # vars in a repo-committed file). Write the auth to a user-level ~/.npmrc
        # with the literal token so pnpm uses it. @dentvega/* are public packages,
        # so the automatic GITHUB_TOKEN is enough to read them.
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          pnpm install --frozen-lockfile=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build chunk
        run: pnpm exec react-native webpack-bundle --platform android --entry-file src/Entry.tsx --bundle-output build/account_dashboard.container.js.bundle --dev false

      - name: Zip build output
        run: cd build && zip -r ../build.zip .

      - name: Publish to Backstage
        run: node scripts/publish.mjs build.zip
        env:
          BACKSTAGE_URL: ${{ secrets.BACKSTAGE_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
